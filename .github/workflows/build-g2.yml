name: Build G2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build G2 package
        run: npm run pack

      - name: Save G2 package
        uses: actions/upload-artifact@v4
        with:
          name: sandevistan-g2
          path: '**/*.ehpk'
          if-no-files-found: error
